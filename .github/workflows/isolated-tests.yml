name: Testes isolados WEB-Academy
on:
  push:
    paths:
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/isolated-tests.yml'
  pull_request:
  workflow_dispatch:
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes sem contas ou dados reais
        run: node --experimental-vm-modules --test tests/*.test.mjs

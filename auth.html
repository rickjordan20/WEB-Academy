<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso • UC7 Web Academy</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css"></head><body class="landing-page"><main class="auth-shell"><section class="auth-brand"><div class="brand-mark">&lt;/&gt;</div><p class="eyebrow">UC7 • Desenvolver aplicações web</p><h1>UC7 <span>Web Academy</span></h1><p class="lead">Acesse sua Jornada Web com uma conta individual.</p></section><section class="auth-card card"><span class="pill">FASE 9 • CONTA CENTRALIZADA</span><h2 id="authTitle">Entrar</h2><p id="authHint" class="muted">Use seu e-mail e senha cadastrados.</p><form id="authForm" class="form-stack"><div id="nameRow" hidden><label for="fullName">Nome completo</label><input id="fullName" autocomplete="name" maxlength="120"></div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><div id="confirmRow" hidden><label for="confirmPassword">Confirmar senha</label><input id="confirmPassword" type="password" minlength="6"></div><button class="btn btn-primary btn-lg" type="submit" id="submitAuth">Entrar</button></form><div class="auth-actions"><button class="btn btn-ghost" type="button" id="toggleMode">Criar minha conta</button><button class="btn btn-ghost" type="button" id="forgotPassword">Esqueci minha senha</button></div><p id="authFeedback" class="feedback" role="status" aria-live="polite"></p><p class="privacy-note">Seu progresso será sincronizado quando o backend da turma estiver configurado.</p></section></main><script type="module" src="js/auth-page.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missões da Guilda • WEB Academy</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/instructor.css"><link rel="stylesheet" href="css/mission-builder.css"><style>html,body{background:#0b1220!important;color:#eaf2ff!important;min-height:100%}body{font-family:Inter,system-ui,sans-serif}main{max-width:1060px;margin:30px auto;padding:24px;background:#101c30;border:1px solid #2d4160;border-radius:18px;box-shadow:0 16px 50px #0004}h1,h2,h3{color:#f3f7ff}p,label,a{color:#d5e2f4}a{color:#7cbcff}.eyebrow{color:#75b6ff!important;font-weight:700;letter-spacing:.08em}.guild-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.guild-field{display:grid;gap:8px;margin:12px 0}.guild-field input,.guild-field textarea{width:100%;padding:12px;border-radius:8px;background:#14243c;color:#f2f7ff;border:1px solid #3b5679}.guild-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.guild-preview{background:#101e33;border:1px solid #355477;padding:18px;border-radius:12px;margin-top:22px}button{cursor:pointer}button.btn{border-radius:10px;padding:11px 18px;font-weight:650}.guild-actions .btn-primary{background:#2478e9;color:white}.guild-actions .btn-secondary{background:#1b3555;color:#eaf2ff;border:1px solid #43648d}.guild-preview[hidden]{display:none}.guild-step{border:1px solid var(--line,#445);padding:15px;border-radius:10px;margin:12px 0}small{color:var(--muted,#aab)}</style></head><body><main><a href="instructor.html#missions">← Voltar às Missões</a><p class="eyebrow">WEB ACADEMY · PROJETO RESTAURANTE</p><h1>Configuração da missão da Guilda</h1><p id="guildStatus" role="status">Carregando...</p><div id="guildEditor" hidden><p>Modelo padronizado: desafio, planejamento no Kanban, execução, revisão e evidência individual. O roteiro técnico pode ser configurado sem modificar a estrutura do construtor EduTech.</p><div class="guild-grid"><div><label class="guild-field">Título<input id="guildTitle" maxlength="160"></label><label class="guild-field">Contexto e desafio<textarea id="guildChallenge" rows="5"></textarea></label><label class="guild-field">Objetivo de aprendizagem<textarea id="guildGoal" rows="4"></textarea></label></div><div><label class="guild-field">Orientações técnicas da aula (uma por linha)<textarea id="guildInstructions" rows="9"></textarea></label><label class="guild-field">Critérios de revisão e evidências (um por linha)<textarea id="guildEvidence" rows="5"></textarea></label></div></div><div class="guild-actions"><button class="btn btn-secondary" id="guildPreview">Visualizar como estudante</button><button class="btn btn-secondary" id="guildSave">Salvar rascunho</button><button class="btn btn-primary" id="guildPublish">Publicar roteiro</button></div><section id="guildPreviewArea" class="guild-preview" hidden></section></div></main><script type="module" src="js/guild-builder-page.js"></script></body></html>

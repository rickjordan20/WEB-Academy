<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missões da Guilda • WEB Academy</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/instructor.css"><style>main{max-width:1060px;margin:30px auto;padding:24px}.guild-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.guild-field{display:grid;gap:8px;margin:12px 0}.guild-field input,.guild-field textarea{width:100%;padding:12px;border-radius:8px;background:var(--surface,#152238);color:inherit;border:1px solid var(--line,#445)}.guild-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.guild-preview{border:1px solid var(--line,#445);padding:18px;border-radius:12px;margin-top:22px}.guild-preview[hidden]{display:none}.guild-step{border:1px solid var(--line,#445);padding:15px;border-radius:10px;margin:12px 0}small{color:var(--muted,#aab)}</style></head><body><main><a href="instructor.html#missions">← Voltar às Missões</a><p class="eyebrow">WEB ACADEMY · PROJETO RESTAURANTE</p><h1>Configuração da missão da Guilda</h1><p id="guildStatus" role="status">Carregando...</p><div id="guildEditor" hidden><p>Modelo padronizado: desafio, planejamento no Kanban, execução, revisão e evidência individual. O roteiro técnico pode ser configurado sem modificar a estrutura do construtor EduTech.</p><div class="guild-grid"><div><label class="guild-field">Título<input id="guildTitle" maxlength="160"></label><label class="guild-field">Contexto e desafio<textarea id="guildChallenge" rows="5"></textarea></label><label class="guild-field">Objetivo de aprendizagem<textarea id="guildGoal" rows="4"></textarea></label></div><div><label class="guild-field">Orientações práticas (uma por linha)<textarea id="guildInstructions" rows="9"></textarea></label><label class="guild-field">Evidências exigidas (uma por linha)<textarea id="guildEvidence" rows="5"></textarea></label></div></div><div class="guild-actions"><button class="btn btn-secondary" id="guildPreview">Visualizar como estudante</button><button class="btn btn-secondary" id="guildSave">Salvar rascunho</button><button class="btn btn-primary" id="guildPublish">Publicar roteiro</button></div><section id="guildPreviewArea" class="guild-preview" hidden></section></div></main><script type="module" src="js/guild-builder-page.js"></script></body></html>

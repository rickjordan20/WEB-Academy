<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia do estudante • WEB-Academy</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/dashboard.css"><style>body{margin:0;background:#0d1627;color:#e7eefc}.preview-shell{max-width:1200px;margin:auto;padding:22px}.preview-banner{background:#173456;border:1px solid #47719a;padding:14px;border-radius:12px;margin-bottom:18px}.preview-grid{display:grid;grid-template-columns:220px 1fr;gap:20px}.preview-nav{display:flex;flex-direction:column;gap:7px}.preview-nav button{padding:12px;text-align:left;background:#18243a;color:inherit;border:1px solid #35455d;border-radius:9px;cursor:pointer}.preview-nav button[aria-current=true]{background:#24588a}.preview-panel{background:#152239;border:1px solid #34445d;border-radius:14px;padding:22px;min-height:440px}.preview-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.preview-stat,.preview-entry{background:#1c304d;border:1px solid #3b526d;border-radius:10px;padding:14px;margin-bottom:10px}.preview-stat b{display:block;font-size:1.5rem}.preview-entry p{white-space:pre-wrap;overflow-wrap:anywhere}.preview-muted{color:#b6c5db}.preview-list{display:grid;gap:10px}.preview-entry h3{margin:0 0 8px}@media(max-width:750px){.preview-grid{grid-template-columns:1fr}.preview-nav{flex-direction:row;overflow:auto}.preview-nav button{white-space:nowrap}}</style></head><body><main class="preview-shell"><div class="preview-banner"><strong>👁 Prévia do estudante — somente leitura</strong><p>Esta é uma reprodução dos dados sincronizados da conta, não uma sessão autenticada do estudante. Nenhuma ação ou entrega pode ser alterada aqui.</p><a href="instructor.html" style="color:#b9dcff">← Voltar à área do instrutor</a></div><header><h1 id="studentName">Carregando estudante...</h1><p class="preview-muted" id="studentMeta"></p></header><div class="preview-grid"><nav class="preview-nav" id="previewNav" aria-label="Seções da visão do estudante"></nav><section class="preview-panel" id="previewContent" aria-live="polite">Carregando informações...</section></div></main><script type="module" src="js/student-preview.js"></script></body></html>
